<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Labs</title>
<style>
  :root { --bg:#eef1f5; --fg:#15202c; --muted:#5a6877; --line:#d6dce4; --card:#fff; --accent:#2557c7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f141b; --fg:#e6ebf1; --muted:#98a5b4; --line:#2c3643; --card:#171e27; --accent:#6f9bff; color-scheme: dark; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:48px 20px; }
  h1 { font-size:40px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 28px; }
  a.lab { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; color:inherit; text-decoration:none; }
  a.lab:hover { border-color:var(--accent); }
  a.lab strong { display:block; font-size:19px; color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Physics Labs</h1>
  <p>Interactive simulation labs for intro college physics.</p>
  <a class="lab" href="gravity-lab/"><strong>Gravity Force Lab</strong>Newton's law of universal gravitation: two masses, a meter rail and the force between them, in 3D.</a>
</main>
</body>
</html>
